name: Docker Compose E2E

on:
  pull_request:
  push:
    branches:
      - "fix/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout CMS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout pinned Kururu Forms
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kurumonn/kururuDjangoCMS_contact_forms
          ref: 09e9cc04aa29f8b29a450c2a0822d5eefed25075  # pragma: allowlist secret
          path: e2e/plugin-src

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/plugin-src/requirements-ci.lock

      - name: Build pinned plugin wheel
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --require-hashes -r e2e/plugin-src/requirements-ci.lock
          python -m build --wheel --no-isolation e2e/plugin-src
          python e2e/prepare_plugin.py --wheel e2e/plugin-src/dist/kururucms_contact_forms-0.2.2-py3-none-any.whl

      - name: Audit E2E JavaScript dependencies
        run: |
          npm --prefix e2e ci --ignore-scripts
          npm --prefix e2e audit --audit-level=high
          npm --prefix e2e run typecheck

      - name: Scan E2E code and tracked files
        run: |
          python -m bandit -r e2e -x e2e/plugin-src -ll
          python scripts/check_secrets.py

      - name: Prepare isolated E2E credentials
        run: python e2e/prepare_environment.py

      - name: Run production-shaped browser E2E
        run: python e2e/run.py
