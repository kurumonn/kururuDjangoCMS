name: Security and test CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Run tests and migration drift checks
        run: |
          python manage.py test --settings=config.settings.test --noinput
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run deployment checks
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.ci

      - name: Run Bandit
        run: >-
          bandit -r accounts blog cms_plugins comments core dashboard media_library pages seo
          -x '*/migrations/*' -ll

      - name: Audit runtime dependencies
        run: |
          pip-audit --requirement requirements.txt
          pip-audit --vulnerability-service osv --requirement requirements.txt

      - name: Check tracked files for secrets
        run: python scripts/check_secrets.py
