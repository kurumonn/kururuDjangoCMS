name: Security and test CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --require-hashes -r requirements.lock -r requirements-ci.lock

      - name: Run tests and migration drift checks
        run: |
          python manage.py test --settings=config.settings.test --noinput
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run deployment checks
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.ci

      - name: Run Bandit
        run: >-
          bandit -r accounts blog cms_plugins comments core dashboard media_library pages seo
          -x '*/migrations/*' -ll

      - name: Audit runtime dependencies
        run: |
          pip-audit --requirement requirements.lock
          pip-audit --vulnerability-service osv --requirement requirements.lock

      - name: Check tracked files for secrets
        run: python scripts/check_secrets.py
