# KururuCMS の本番相当の構成。
#
#   docker compose up -d --build
#
# 4つのコンテナが役割を分けている。
#
#   nginx  外からの窓口。HTTPS の終端と、静的ファイル・画像の配信
#   web    Django（Gunicorn）。HTML を組み立てる仕事だけをする
#   db     PostgreSQL
#   redis  キャッシュとセッション、そしてレート制限の回数
#
# 「web が全部やればいいのでは」と思うところだが、
# 画像1枚を返すたびに Python のワーカーが1つ埋まると、
# 同時に記事を読める人数がそのぶん減る。
# 静的なファイルは nginx に任せる。

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    # ポートを外へ出さない。
    # 5432 をホストへ公開すると、そのサーバーのファイアウォール次第で
    # インターネットから直接データベースへ届く。
    # web からはコンテナ間ネットワークで繋がるので、公開は不要。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    # appendonly を有効にすると、再起動してもセッションが残る。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      APP_START_MODE: "migrate"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    networks:
      - backend

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_START_MODE: "web"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # nginx へ渡すために共有する。
      - staticfiles:/app/staticfiles
      - media:/app/media
    networks:
      - frontend
      - backend
    # ここでもポートを公開しない。外からは必ず nginx を通す。
    healthcheck:
      # 中身は docker/healthcheck.py を参照。
      # コンテナの中から自分を叩くと nginx を通らないので、
      # ALLOWED_HOSTS と SECURE_SSL_REDIRECT の両方に引っかかる。
      # スクリプト側で nginx が付けるヘッダーを再現している。
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
        # Compose経由でwebを更新・再起動したとき、ready後にNginxも追従する。
        restart: true
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      # Nginx 組み込みの $host 等を envsubst の対象にしない。
      NGINX_ENVSUBST_FILTER: ^NGINX_SERVER_NAME$
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - tls_certificate
      - tls_private_key
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/healthcheck.sh:/healthcheck.sh:ro
      # 読み取り専用でマウントする。
      # nginx が書き込める必要は無いので、権限は狭くしておく。
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "/bin/sh", "/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?TLS_PRIVATE_KEY_FILE is required}

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
