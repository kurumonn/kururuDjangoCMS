# 本番イメージをローカルで動作確認するための上書き設定。
#
#   docker compose -f compose.yaml -f compose.local-check.yaml up -d --build
#
# ★本番では使わない。★
#
# production.pyを緩めず、自己署名証明書で本番と同じHTTPS経路を確認する。
# 証明書と秘密鍵のパスは .env の TLS_*_FILE で指定する。

services:
  nginx:
    # ローカルでも本番と同じTLS経路を通す。自己署名証明書は .env で指定する。
    environment:
      NGINX_SERVER_NAME: localhost
