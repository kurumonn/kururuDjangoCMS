services:
  db:
    restart: "no"

  redis:
    restart: "no"

  web:
    restart: "no"
    volumes:
      - ./e2e:/e2e:ro

  contact_forms_worker:
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      smtp_capture:
        condition: service_healthy

  contact_forms_maintenance:
    restart: "no"

  nginx:
    restart: "no"
    environment:
      NGINX_SERVER_NAME: e2e.local
    ports: !override
      - "127.0.0.1:${KURURU_E2E_HTTPS_PORT:-8443}:443"
    networks:
      frontend:
        aliases:
          - e2e.local

  smtp_capture:
    image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    restart: "no"
    command: ["python", "/e2e/smtp_capture.py"]
    volumes:
      - ./e2e:/e2e:ro
    networks:
      - mail_egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15

  playwright:
    profiles: ["e2e"]
    build:
      context: ./e2e
    environment:
      E2E_BASE_URL: https://e2e.local
      E2E_VIEWER_EMAIL: viewer@example.test
      E2E_VIEWER_PASSWORD: ${KURURU_E2E_VIEWER_PASSWORD:?KURURU_E2E_VIEWER_PASSWORD is required}
    depends_on:
      nginx:
        condition: service_healthy
      smtp_capture:
        condition: service_healthy
    networks:
      - frontend
      - mail_egress
